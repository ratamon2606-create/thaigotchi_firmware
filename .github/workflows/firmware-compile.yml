name: ESP32 Firmware Compile

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board core
        run: |
          BOARD_URL="https://espressif.github.io/arduino-esp32/package_esp32_index.json"
          arduino-cli core update-index --additional-urls "$BOARD_URL"
          arduino-cli core install esp32:esp32@3.0.7 \
            --additional-urls "$BOARD_URL"

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SH110X"
          arduino-cli lib install "TinyGPSPlus"
          arduino-cli lib install "ArduinoJson"

      - name: Compile ESP32 firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --board-options PartitionScheme=huge_app \
            .
